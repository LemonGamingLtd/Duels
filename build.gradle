buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }

    dependencies {
        classpath 'com.gradleup.shadow:shadow-gradle-plugin:8.3.0'
    }
}

allprojects {
    group 'me.realized'
    version '3.5.5'
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'java-library'
    apply plugin: 'com.gradleup.shadow'
    apply plugin: 'maven-publish'

    sourceCompatibility = 21
    targetCompatibility = 21

    repositories {
        mavenCentral()

        maven {
            name = 'papermc'
            url = 'https://repo.papermc.io/repository/maven-public/'
        }

        maven {
            name 'spigot-repo'
            url 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/'
        }

        maven {
            name 'bungeecord-repo'
            url 'https://oss.sonatype.org/content/repositories/snapshots/'
        }

        maven {
            name 'mojang-repo'
            url 'https://libraries.minecraft.net/'
        }

        maven {
            name 'clip-repo'
            url 'https://repo.extendedclip.com/content/repositories/placeholderapi/'
        }

        maven {
            name 'enginehub-repo'
            url 'https://maven.enginehub.org/repo/'
        }

        maven {
            name 'codemc-repo'
            url 'https://repo.codemc.io/repository/maven-public/'
        }

        maven {
            name 'essentialsx-repo'
            url 'https://repo.essentialsx.net/releases/'
        }

        maven {
            name 'jitpack'
            url 'https://jitpack.io'
        }

        maven {
            credentials {
                username = providers.gradleProperty('lgNexusUser').get()
                password = providers.gradleProperty('lgNexusPass').get()
            }
            url = 'https://repo.lemongaming.ltd/repository/maven-public/'
        }

        flatDir {
            dirs "$rootDir/libs/"
        }
    }
}